#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#
pre-commit:
  jobs:
    - glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx run lint:fix && fmt:check
      stage_fixed: true

commit-msg:
  commands:
    "lint commit message":
      run: npx commitlint --edit {1}
